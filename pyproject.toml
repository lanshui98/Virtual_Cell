[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-cell-lowrank"
version = "0.1.0"
description = "Reconstructed ESM2-conditioned low-rank perturbation effect pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "scipy>=1.10", "pandas>=2.0", "anndata>=0.10", "h5py>=3.8", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
vcell-lowrank = "virtual_cell_lowrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
